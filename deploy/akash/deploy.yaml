---
# Akash SDL — earth gas-grant service.
#
# One FastAPI app. It holds a hot key and turns a registration the chain would
# accept (/gas/register, checked by `earthd gas-check`) into a shielded fee note
# for a new human's first transaction, and serves the privacy indexer.
#
# See README.md in this directory. Read the note on GAS_WALLET_MNEMONIC before
# deploying: it is the one thing here that is genuinely a secret, and Akash's
# trust model does not keep it one.
version: "2.0"

services:
  app:
    # Pin a digest, not a tag. CI builds and pushes on `v*.*.*` tags only;
    # resolve the tag to its digest with bin/digest.sh, which reads it back
    # from the registry.
    image: ghcr.io/zenopie/earth-network-backend@sha256:ecb26e2536864f12a745f7e88edd0ce1e77c0b2d82c614bd231efa1df25cc206

    env:
      # The chain this grants dust on. cosmpy wants a scheme-prefixed URL, and
      # REST is what the node exposes.
      #
      # DO NOT lease this on the same provider as the chain. The URL is the
      # provider's own public hostname and NodePort, so from inside that
      # provider's cluster it is a hairpin back to itself, and it hangs rather
      # than failing. cosmpy builds its LedgerClient during FastAPI's startup
      # event, so a hang there means uvicorn never finishes starting: the port
      # accepts TCP from the socket backlog and then never answers, while the
      # pod reports ready=1 because nothing here defines a readiness probe.
      # Deployed on hurricane alongside the chain it did exactly that; moved to
      # another provider, unchanged, it came up on the second poll.
      - EARTH_NODE_URL=rest+https://lcd.erth.network
      - EARTH_CHAIN_ID=earth-1
      - EARTH_PREFIX=earth
      - EARTH_DENOM=uerth
      # The chain runs --minimum-gas-prices 0uerth, but cosmpy still prices the
      # fee it puts in the tx; leaving the default is harmless and survives the
      # node later requiring a real minimum.
      - EARTH_GAS_PRICE=0.025
      # What one /gas/register grant (a shielded fee note) is worth. Has to
      # cover a registration (6M gas limit at 0.005 uerth/gas = 30,000 uerth).
      - DUST_UERTH=100000
      # Rolling 24h cap on /gas/register payouts: 500 x 0.1 ERTH = 50 ERTH a
      # day, whatever a run of fresh or stolen passports tries.
      - REGISTER_GRANT_MAX_PER_DAY=500
      # The privacy indexer (services/privacy): follows the chain over CometBFT
      # RPC into /app/state/privacy_index.db and serves /privacy/* to wallets.
      # The RPC must keep block results from the start height on — for a full
      # history, a node that has never pruned blocks since genesis.
      # rpc.erth.network is that node: earth-1 runs one node, the validator,
      # with full history (pruning=nothing, discard_abci_responses=false). It
      # is CometBFT RPC, not the LCD: the indexer reads /block_results. Once the
      # index holds blocks, INDEXER_START_HEIGHT is ignored.
      - INDEXER_ENABLED=true
      - INDEXER_RPC_URL=https://rpc.erth.network:443
      - INDEXER_START_HEIGHT=0
      - INDEX_DB=/app/state/privacy_index.db
      #
      # GAS_WALLET_MNEMONIC is NOT set here. Everything in this file is sent to
      # the provider hosting the lease, so a mnemonic written here is a mnemonic
      # handed to a third party — and this one holds spendable ERTH, unlike the
      # chain's validator key which at worst costs you a devnet.
      #
      # Set it at deploy time instead, by substituting it into the SDL that is
      # POSTed rather than into the file that is committed. It still reaches the
      # provider either way; what this avoids is it reaching the repository.

    expose:
      # Tunnel-only. Nothing is published on a provider port: every entry below
      # goes to `cloudflared`, so the only way in is a Cloudflare hostname.
      # Verified serving before the mapped ports were removed, because dropping
      # them is a structural change and cannot be undone in place.
      # HTTP API: /gas/register for the apps' grant requests, /privacy/* for wallet
      # sync, /health for the balance. Exposed on a mapped port rather than `as: 80` — see the chain
      # repo's SDL for why; the generated ingress hostname was not reliable.
      - port: 8000
        as: 8000
        to:
          - service: cloudflared

    params:
      storage:
        state:
          # Replay protection for grant ids, and the history the daily caps count.
          mount: /app/state
          readOnly: false

  # Cloudflare Tunnel connector. Dials out, so it needs no inbound port.
  #
  # The apps call https://api.erth.network, so the hostname has to survive a
  # lease change, and Akash reassigns the external port on every new lease.
  #
  # Configure the Public Hostname on Cloudflare's side to http://app:8000, which
  # resolves over the cluster network because `app` exposes 8000 to this service.
  cloudflared:
    # Pinned by digest. This container holds TUNNEL_TOKEN and sits in front of
    # every grant request; `latest` meant whatever was pushed last got both on the
    # next lease. Bump deliberately.
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    # `cloudflared` first: Akash's `command` maps to Kubernetes `command`, which
    # REPLACES the image entrypoint rather than appending to it. Without the
    # binary name the container tries to exec something called `tunnel` and the
    # service never starts — the lease reports available=0/1 with no other clue.
    command:
      - cloudflared
      - tunnel
      - --no-autoupdate
      # Akash rejects a manifest with "zero global services", so something must
      # be published. Publishing cloudflared's own metrics rather than the
      # application keeps the chain and the service reachable only through the
      # tunnel, and /ready gives a way to check connector health without the
      # Cloudflare dashboard — which matters here because the Console API has no
      # logs endpoint, and a connector that fails to start is otherwise silent.
      - --metrics
      - 0.0.0.0:2000
      - run

    expose:
      - port: 2000
        as: 2000
        to:
          - global: true
    # TUNNEL_TOKEN is injected at deploy time, like GAS_WALLET_MNEMONIC. It lives
    # in this repo's gitignored .env; anyone holding it can attach a replica to
    # the tunnel and receive its traffic.
    env: []

profiles:
  compute:
    app:
      resources:
        # Measured, not guessed: the service idles at 69 MB RSS with the wallet
        # built and a /health round trip served, so 256Mi is roughly 4x what it
        # uses. It is one process serving requests that are rate-limited by the
        # daily grant cap.
        cpu:
          units: 0.1
        memory:
          size: 256Mi
        storage:
          # Root: python:3.11-slim plus cosmpy's dependency tree.
          - size: 2Gi
          # The replay database. Losing it loses the record of which passports
          # were granted this month — each could be paid again — and resets
          # the daily cap.
          - name: state
            # Also the privacy index: roughly 300 bytes a note (commitment plus
            # ciphertext), so 4Gi holds on the order of ten million notes.
            # Persistent storage cannot grow in place; a bigger volume is a
            # new lease, and the index rebuilds from the chain on its own.
            size: 4Gi
            attributes:
              persistent: true
              class: beta3

    cloudflared:
      resources:
        cpu:
          units: 0.1
        memory:
          size: 128Mi
        storage:
          - size: 512Mi

  placement:
    dcloud:
      pricing:
        app:
          denom: uakt
          amount: 10000
        cloudflared:
          denom: uakt
          amount: 10000

deployment:
  app:
    dcloud:
      profile: app
      # One replica. Sends are serialised behind a single lock on one account
      # sequence; a second replica shares the account but not the lock, and they
      # would race to reuse the same sequence number.
      count: 1
  cloudflared:
    dcloud:
      profile: cloudflared
      count: 1
