services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    env_file:
      - .env.local
    environment:
      # Never trust CF-Connecting-IP here: there is no Cloudflare in front, so
      # any client could pick its own rate-limit key. Overrides .env.local.
      TRUST_CF_CONNECTING_IP: "false"
    ports:
      # Loopback only: a local stack is not an ingress.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./:/app:delegated
    restart: unless-stopped
